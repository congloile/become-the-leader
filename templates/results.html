<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Results - Become the Leader</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='results.css') }}" />
    <script src="{{ url_for('static', filename='results.js') }}" defer></script>
  </head>

  <body>
    <main class="results-container">
      <header class="results-header">
        <h1>GAME RESULTS</h1>
        <h2 id="result-title">Loading results...</h2>
        <p id="result-description"></p>
      </header>

      <section class="result-panel" aria-labelledby="indicators-heading">
        <h2 id="indicators-heading">Final National Indicators</h2>
        <div id="final-indicators"></div>
      </section>

      <section class="result-panel" aria-labelledby="goals-heading">
        <h2 id="goals-heading">Victory Goals</h2>
        <div id="final-goals"></div>
        <p id="result-reason"></p>
      </section>

      <section class="result-panel" id="score-panel" aria-labelledby="score-heading" hidden>
        <h2 id="score-heading">Final Score</h2>
        <p id="final-score"></p>
      </section>

      <p id="result-error" role="alert"></p>

      <div class="result-actions">
        <button id="menu-button" type="button">Main Menu</button>
        <button id="retry-button" type="button">Play Again</button>
      </div>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Become the Leader</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <script src="{{ url_for('static', filename='menu.js') }}"></script>
    <main class="menu-container">
      <img
        src="{{ url_for('static', filename='images/game-logo.png') }}"
        alt="Become the Leader official game emblem"
        class="game-logo-image"
      />

      <h1>BECOME THE LEADER</h1>

      <p class="subtitle">Three nations. Ten rounds. One leadership journey.</p>

      <p class="availability">Finland available now.</p>

      <nav class="menu-buttons" aria-label="Main menu">
        <button type="button" id="new-game">New Game</button>

        <button type="button" id="how-to-play">How to Play</button>

        <button type="button" id="high-scores">High Scores</button>

        <button type="button" id="about">About</button>
      </nav>

      <footer>12+ | Supports the UN Sustainable Development Goals</footer>
    </main>
  </body>
</html>

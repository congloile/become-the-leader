<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Consequence - Become the Leader</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='consequence.css') }}"
    />

    <script
      src="{{ url_for('static', filename='consequence.js') }}"
      defer
    ></script>
  </head>

  <body>
    <main class="consequence-container">
      <header class="consequence-header">
        <h1>POLICY CONSEQUENCES</h1>

        <p id="round-display">Loading...</p>
      </header>

      <section class="consequence-panel">
        <p class="section-label">YOUR DECISION</p>

        <h2 id="decision-title">Loading policy...</h2>
      </section>

      <section class="consequence-panel">
        <h2>Indicator Changes</h2>

        <div class="table-wrapper">
          <table class="impact-table">
            <thead>
              <tr>
                <th>Indicator</th>
                <th>Before</th>
                <th>Base Effect</th>
                <th>Actual Change</th>
                <th>After</th>
              </tr>
            </thead>

            <tbody id="impact-body"></tbody>
          </table>
        </div>

        <p id="difficulty-note"></p>
      </section>

      <!-- Policy outcome explanation -->
      <section id="policy-outcome" class="consequence-panel" hidden>
        <h2>Policy Outcome</h2>
        <p id="outcome-summary"></p>
        <div id="outcome-details"></div>
      </section>

      <section id="warning-panel" class="warning-panel" hidden>
        <h2>National Warning</h2>
        <p id="warning-message"></p>
      </section>

      <p id="game-message" role="status" aria-live="polite"></p>

      <div class="consequence-actions">
        <button type="button" id="menu-button">Main Menu</button>

        <button type="button" id="next-button" disabled>Next Round</button>
      </div>
    </main>
  </body>
</html>
